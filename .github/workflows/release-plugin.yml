name: Release LS Netontwerp Wizard

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - ls_netontwerp_wizard/metadata.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-ls-netontwerp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Bouw en publiceer plugin ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pluginversie uitlezen
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F= '$1 == "version" { gsub(/[[:space:]\r]/, "", $2); print $2; exit }' ls_netontwerp_wizard/metadata.txt)"
          if [[ -z "$VERSION" ]]; then
            echo "Geen version= gevonden in metadata.txt" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Ongeldig versienummer: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=ls_netontwerp_wizard-$VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "Pluginversie: $VERSION"

      - name: Python-bronnen controleren voor publicatie
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = sorted(Path("ls_netontwerp_wizard").rglob("*.py"))
          assert files
          for path in files:
              ast.parse(path.read_text(encoding="utf-8-sig"), filename=str(path))
          print(f"Syntax OK: {len(files)} bestanden")
          PY

      - name: ZIP bouwen
        shell: bash
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import io
          import os
          import subprocess
          import zipfile

          data = subprocess.check_output([
              "git", "archive", "--format=zip", "--prefix=ls_netontwerp_wizard/",
              "HEAD:ls_netontwerp_wizard",
          ])
          with zipfile.ZipFile(io.BytesIO(data)) as source, zipfile.ZipFile(
              os.environ["ZIP_NAME"], "w", zipfile.ZIP_DEFLATED
          ) as result:
              for member in source.infolist():
                  if "__pycache__" in member.filename.split("/") or member.filename.endswith((".pyc", ".pyo")):
                      continue
                  result.writestr(member.filename, source.read(member))
          PY

      - name: ZIP-structuur controleren
        shell: bash
        env:
          ZIP_NAME: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          import zipfile

          zip_name = os.environ["ZIP_NAME"]
          with zipfile.ZipFile(zip_name) as archive:
              names = archive.namelist()

          if not names:
              raise SystemExit("De release-ZIP is leeg.")
          if any("__pycache__" in name.split("/") or name.endswith((".pyc", ".pyo")) for name in names):
              raise SystemExit("De release-ZIP bevat Python-cachebestanden.")

          outside = [name for name in names if not name.startswith("ls_netontwerp_wizard/")]
          if outside:
              print("Bestanden buiten ls_netontwerp_wizard/:", file=sys.stderr)
              for name in outside[:20]:
                  print(f" - {name}", file=sys.stderr)
              raise SystemExit(1)

          required = "ls_netontwerp_wizard/metadata.txt"
          if required not in names:
              raise SystemExit(f"{required} ontbreekt in de release-ZIP.")

          print(f"ZIP gecontroleerd: {len(names)} entries, alles onder ls_netontwerp_wizard/.")
          PY

      - name: Release aanmaken of ZIP vervangen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP_NAME: ${{ steps.version.outputs.zip }}
        run: |
          set -euo pipefail

          NOTES_FILE="ls_netontwerp_wizard/RELEASE_NOTES.md"
          test -s "$NOTES_FILE"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG bestaat al; asset wordt veilig vervangen."
            gh release upload "$TAG" "$ZIP_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "LS Netontwerp Wizard $TAG" \
              --notes-file "$NOTES_FILE"
          else
            echo "Nieuwe release $TAG wordt aangemaakt."
            gh release create "$TAG" "$ZIP_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "LS Netontwerp Wizard $TAG" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Samenvatting
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ZIP_NAME: ${{ steps.version.outputs.zip }}
        run: |
          {
            echo "## LS Netontwerp Wizard release"
            echo
            echo "- Versie: **$VERSION**"
            echo "- ZIP: **$ZIP_NAME**"
            echo "- ZIP-root: **ls_netontwerp_wizard/**"
          } >> "$GITHUB_STEP_SUMMARY"
